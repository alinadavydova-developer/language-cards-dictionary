version: '3.8'

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus.yml # Монтируем наш файл конфигурации
    ports:
      - "9090:9090" # Порт для доступа к веб-интерфейсу Prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway" # Необходимо для доступа к хосту из контейнера в некоторых ОС

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000" # Порт для доступа к веб-интерфейсу Grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin # Логин для входа в Grafana
      - GF_SECURITY_ADMIN_PASSWORD=admin # Пароль (обязательно смените в продакшене!)
    volumes:
      - grafana-storage:/var/lib/grafana # Том для хранения данных Grafana (дашбордов и т.д.)

volumes:
  grafana-storage: